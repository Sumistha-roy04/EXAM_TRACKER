<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><style>html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style><title>Exam Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky header with day strip, then two columns (tasks | timer). Tabs switch Today / Syllabus / Stats. */
:root{
  --bg:#EDEFF4; --surface:#FFFFFF; --surface2:#F5F6FA; --ink:#14213D; --muted:#5A6379; --line:#D6DBE5;
  --accent:#2748D8; --accent-ink:#FFFFFF; --hi:#FFD84D; --hi-ink:#3A2E00; --ok:#1E8E5A; --warn:#B7791F; --bad:#C23B4E;
  --s-daa:#2F6FDB; --s-dmdw:#1E8E5A; --s-se:#B7791F; --s-cn:#D1495B; --s-ee:#7A5AC8; --s-dos:#0E8F9C; --s-all:#5A6379;
  --f-display:'Archivo','Arial Narrow',system-ui,sans-serif; --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1320; --surface:#161C2B; --surface2:#1C2336; --ink:#E9EDF7; --muted:#9AA4BD; --line:#2B3450;
  --accent:#8097FF; --accent-ink:#0E1320; --hi:#FFD84D; --hi-ink:#3A2E00; --ok:#4FD39A; --warn:#F2BE5C; --bad:#FF8A97;
  --s-daa:#7FA8FF; --s-dmdw:#58D69A; --s-se:#F2BE5C; --s-cn:#FF8A97; --s-ee:#B79CFF; --s-dos:#4FD3E0; --s-all:#9AA4BD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#161C2B; --surface2:#1C2336; --ink:#E9EDF7; --muted:#9AA4BD; --line:#2B3450;
  --accent:#8097FF; --accent-ink:#0E1320; --hi:#FFD84D; --hi-ink:#3A2E00; --ok:#4FD39A; --warn:#F2BE5C; --bad:#FF8A97;
  --s-daa:#7FA8FF; --s-dmdw:#58D69A; --s-se:#F2BE5C; --s-cn:#FF8A97; --s-ee:#B79CFF; --s-dos:#4FD3E0; --s-all:#9AA4BD; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1120px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;border-bottom:1px solid var(--line)}
.top-row{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.brand h1{font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1}
.brand small{display:block;color:var(--muted);margin-top:4px}
.next{font-size:13px;color:var(--muted);text-align:right}
.next b{color:var(--ink);font-family:var(--f-display);font-size:15px}
.overall{display:flex;align-items:center;gap:10px;margin-top:10px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:0}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.overall span{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.days{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin-top:10px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 2px 4px;text-align:center;position:relative;min-width:0}
.day .n{font-family:var(--f-display);font-weight:800;font-size:15px;line-height:1.1}
.day .w{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day .m{font-size:9px;font-weight:600;letter-spacing:.05em;min-height:11px;color:var(--bad)}
.day .fill{position:absolute;left:0;bottom:0;height:3px;background:var(--ok);border-radius:0 0 8px 8px}
.day.today{box-shadow:0 0 0 2px var(--hi)}
.day.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day.sel .w{color:inherit;opacity:.75}.day.sel .m{color:var(--hi)}
.tabs{display:flex;gap:4px;margin-top:10px}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.sync{margin-left:auto;align-self:center;font-size:11px;color:var(--muted)}
main{padding-top:16px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.dayhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.dayhead h2{font-size:22px;font-weight:800}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--hi);color:var(--hi-ink)}
.badge.red{background:var(--bad);color:var(--bg)}
.sub{color:var(--muted);margin:0 0 14px}
.tasks{display:flex;flex-direction:column;gap:12px}
.task{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;--c:var(--s-all);border-left:4px solid var(--c)}
.task.current{box-shadow:0 0 0 2px var(--accent)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.t-head{display:flex;gap:10px;padding:12px;align-items:flex-start;background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.chk{appearance:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;background:var(--surface);flex:none;margin:1px 0 0;cursor:pointer;display:grid;place-content:center}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.t-main{flex:1;min-width:0}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-bottom:3px}
.pill{font-weight:700;font-size:11px;letter-spacing:.05em;color:var(--c);text-transform:uppercase}
.tt{font-weight:500;overflow-wrap:anywhere}
.go{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:5px 10px;font-weight:600;font-size:12px;white-space:nowrap}
.go:hover{background:var(--accent);color:var(--accent-ink)}
.topics{padding:8px 12px 12px;border-top:1px dashed var(--line)}
.topics h4{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.unit-name{font-weight:600;font-size:13px;margin:8px 0 2px}
.tl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 14px}
.tl label{display:flex;gap:8px;align-items:flex-start;padding:3px 0;cursor:pointer;font-size:13px;min-width:0}
.tl input{margin-top:3px;accent-color:var(--ok);flex:none}
.tl input:checked+span{color:var(--muted);text-decoration:line-through}
.tl span{overflow-wrap:anywhere}
.timer{position:sticky;top:calc(env(safe-area-inset-top,0px) + 210px)}
.t-mode{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.t-mode b{color:var(--accent)}
.ring{position:relative;width:200px;height:200px;margin:10px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .digits{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .time{font-family:var(--f-mono);font-weight:600;font-size:44px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring .for{font-size:11px;color:var(--muted);max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-width:110px}
.btn:hover{filter:brightness(1.06)}
.presets{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 10px;font-size:12px}
.presets button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cur{margin-top:12px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=number]{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
input[type=number]{width:58px}
.today-min{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.today-min b{font-family:var(--f-mono);font-size:20px}
.log{margin:8px 0 0;padding:0;list-style:none;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.log li{display:flex;justify-content:space-between;gap:8px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-weight:600;font-size:12px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:12px}
details.unit{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;background:var(--surface);--c:var(--s-all)}
details.unit>summary{list-style:none;cursor:pointer;padding:12px;display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--c) 9%,var(--surface));border-radius:8px}
details.unit>summary::-webkit-details-marker{display:none}
.u-title{flex:1;min-width:0}
.u-title b{display:block;font-family:var(--f-display);font-weight:700}
.u-title small{color:var(--muted)}
.u-pct{font-family:var(--f-mono);font-size:12px}
.u-body{padding:10px 12px 12px}
.u-ctl{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px}
.conf{display:flex;gap:3px}
.conf button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:12px}
.conf button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.conf button.low[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.pyq{display:flex;gap:6px;align-items:center;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.stat-big{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:6px}
.stat-big div b{display:block;font-family:var(--f-mono);font-size:26px}
.stat-big div span{font-size:12px;color:var(--muted)}
.srow{display:grid;grid-template-columns:62px minmax(0,1fr) 78px;gap:10px;align-items:center;margin:8px 0;font-size:12px}
.srow .bar{height:12px}
.srow .bar>i{background:var(--c)}
.srow span:last-child{font-family:var(--f-mono);text-align:right}
.hm{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin-top:8px}
.hm div{aspect-ratio:1.3;border-radius:6px;border:1px solid var(--line);display:grid;place-content:center;font-size:11px;font-family:var(--f-mono);background:color-mix(in srgb,var(--accent) calc(var(--a,0)*70%),var(--surface))}
.hm div.t{box-shadow:0 0 0 2px var(--hi)}
.muted{color:var(--muted)}
.theme{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:12px}
.reset{margin-top:20px;font-size:12px;color:var(--muted)}
.reset button{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 10px;font-size:12px;color:var(--bad)}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.go.ghost{border-color:var(--line);color:var(--muted)}
.go.ghost:hover{background:var(--surface2);color:var(--ink)}
.mvd{color:var(--warn);font-weight:600}
.mvmenu{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-top:1px dashed var(--line);background:var(--surface2);font-size:12px}
.mvmenu select{max-width:100%}
.mvmenu .btn{padding:6px 12px}
.pushbtn{margin:-4px 0 14px;font-size:12px;padding:6px 12px}
@media (max-width:860px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .timer{position:static;order:-1}
  .days{grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
  .day .w{display:none}.day .n{font-size:13px}
  .next{text-align:left}
}
@media (max-width:420px){.days{grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day .w{display:block;font-size:8px}.hm{grid-template-columns:repeat(7,minmax(0,1fr))}.srow{grid-template-columns:52px minmax(0,1fr) 70px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand"><h1>Exam Sprint</h1><small id="dateline"></small></div>
      <div class="next" id="next"></div>
    </div>
    <div class="overall"><div class="bar"><i id="ovbar" style="width:0%"></i></div><span id="ovtxt"></span></div>
    <div class="days" id="days" role="tablist" aria-label="Plan days"></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="today" aria-selected="true">Today</button>
      <button class="tab" role="tab" data-tab="syll" aria-selected="false">Syllabus</button>
      <button class="tab" role="tab" data-tab="stats" aria-selected="false">Stats</button>
      <span class="sync" id="sync"></span>
    </div>
  </header>

  <main>
    <section id="v-today" class="grid">
      <div>
        <div class="panel">
          <div class="dayhead"><h2 id="dh"></h2><span id="dbadge"></span></div>
          <p class="sub" id="dsub"></p>
          <button class="btn pushbtn" id="push" hidden>Push unfinished</button>
          <div class="tasks" id="tasks"></div>
        </div>
      </div>
      <aside class="panel timer" aria-label="Study timer">
        <div class="t-mode"><span>Timer</span><b id="mode">Focus</b></div>
        <div class="ring">
          <svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--line)" stroke-width="8"/><circle id="arc" cx="60" cy="60" r="54" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="0"/></svg>
          <div class="digits"><div class="time" id="time" aria-live="off">50:00</div><div class="for" id="for">Free session</div></div>
        </div>
        <div class="row"><button class="btn primary" id="startBtn">Start</button><button class="btn" id="resetBtn">Reset</button><button class="btn" id="skipBtn">Skip</button></div>
        <div class="presets" id="presets"></div>
        <div class="cur">
          <label for="fm">Focus</label><input type="number" id="fm" min="1" max="180" value="50"><label for="bm">Break</label><input type="number" id="bm" min="1" max="60" value="10"><span>min</span>
        </div>
        <div class="cur" id="freeRow"><label for="freeSubj">Free session subject</label>
          <select id="freeSubj"></select></div>
        <div class="today-min"><span class="muted">Focused today</span><b id="tmin">0 min</b></div>
        <ul class="log" id="log"></ul>
      </aside>
    </section>

    <section id="v-syll" hidden>
      <div class="filters" id="filters"></div>
      <div class="units" id="units"></div>
    </section>

    <section id="v-stats" hidden>
      <div class="stats">
        <div class="panel"><h3>Focus time</h3>
          <div class="stat-big" id="bigstats"></div>
          <div id="subjbars"></div></div>
        <div class="panel"><h3>Syllabus covered</h3><div id="sylbars"></div></div>
        <div class="panel" style="grid-column:1/-1"><h3>Minutes per day</h3><div class="hm" id="hm"></div></div>
      </div>
      <div class="reset"><button id="wipe">Reset all progress</button> <span id="wipeNote"></span></div>
    </section>
  </main>
</div>

<script>

const SUBJ={DAA:'Algorithms',DMDW:'Data Mining',SE:'Software Eng.',CN:'Networks',EE:'Eng. Economics',DOS:'Distributed OS',ALL:'General'};

  else if(b.dataset.domove){const id=b.dataset.domove,t=T.find(x=>x.id===id),d=+$('mvday').value,sl=$('mvslot').value;
    if(d===t.day)delete S.moved[id];else S.moved[id]=d;
    if(sl===t.slot||(t.slot==='Travel'&&sl==='Afternoon'))delete S.slots[id];else S.slots[id]=sl;
    moveOpen=null;save();sel=d;renderAll();}
  else if(b.dataset.unmove){const id=b.dataset.unmove;delete S.moved[id];delete S.slots[id];moveOpen=null;save();renderAll();}
  else if(b.id==='push'){const d=+b.dataset.push;dayTasks(d).filter(t=>!S.done[t.id]).forEach(t=>{S.moved[t.id]=d+1;});save();moveOpen=null;sel=d+1;renderAll();}
  else if(b.dataset.go){T_cur=b.dataset.go;const t=T.find(x=>x.id===T_cur);setMode('focus');renderToday();if(!tm.running)startTimer();window.scrollTo({top:0,behavior:'smooth'});}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details.unit')){if(d.open)openU.add(d.dataset.u);else openU.delete(d.dataset.u);}},true);

/* ---------- TIMER ---------- */
let T_cur=null;
const tm={mode:'focus',running:false,endAt:0,left:S.set.focus*60000,total:S.set.focus*60000,startedAt:0};
let audio=null,wake=null,iv=null;
const PRE=[[25,5],[50,10],[90,20]];
function curSubj(){const t=T.find(x=>x.id===T_cur);return t?t.s:$('freeSubj').value;}
function setMode(m){tm.mode=m;tm.running=false;const mins=m==='focus'?S.set.focus:S.set.brk;tm.total=tm.left=mins*60000;paintTimer();paintBtns();}
function beep(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();[0,0.25,0.5].forEach(o=>{const os=audio.createOscillator(),g=audio.createGain();os.frequency.value=o===0.5?988:784;os.connect(g);g.connect(audio.destination);const t=audio.currentTime+o;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);os.start(t);os.stop(t+0.25);});}catch(e){}}
async function lock(on){try{if(on&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');}else if(wake){await wake.release();wake=null;}}catch(e){}}
function startTimer(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume&&audio.resume();}catch(e){}
  tm.running=true;tm.endAt=Date.now()+tm.left;tm.startedAt=tm.startedAt||Date.now();clearInterval(iv);iv=setInterval(tick,250);lock(true);paintBtns();paintTimer();}
function pauseTimer(){tm.left=Math.max(0,tm.endAt-Date.now());tm.running=false;clearInterval(iv);lock(false);paintBtns();paintTimer();}
function logSession(msElapsed){const m=Math.round(msElapsed/60000);if(tm.mode!=='focus'||m<1)return;S.log.push({d:ymd(new Date()),s:curSubj(),m,t:T_cur||'',at:Date.now()});save();renderAll();}
function tick(){const left=tm.endAt-Date.now();if(left<=0){clearInterval(iv);tm.running=false;tm.left=0;beep();lock(false);const el=tm.total;logSession(el);const next=tm.mode==='focus'?'brk':'focus';tm.startedAt=0;setMode(tm.mode==='focus'?'break':'focus');$('mode').textContent=tm.mode==='focus'?'Focus':'Break';return;}
  tm.left=left;paintTimer();}
function resetTimer(){const elapsed=tm.total-(tm.running?Math.max(0,tm.endAt-Date.now()):tm.left);clearInterval(iv);if(tm.mode==='focus'&&elapsed>=60000)logSession(elapsed);lock(false);tm.startedAt=0;setMode(tm.mode);}
function paintTimer(){const l=tm.running?Math.max(0,tm.endAt-Date.now()):tm.left;const s=Math.ceil(l/1000);$('time').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  $('arc').style.strokeDashoffset=339.29*(1-(tm.total?l/tm.total:0))*-1+0;$('arc').setAttribute('stroke-dashoffset',339.29*(1-(tm.total?l/tm.total:0)));
  $('mode').textContent=tm.mode==='focus'?'Focus':'Break';
  const t=T.find(x=>x.id===T_cur);$('for').textContent=tm.mode==='break'?'Rest your eyes':(t?t.s+': '+t.text:'Free session');$('for').title=t?t.text:'';
  $('freeRow').hidden=!!t&&tm.mode==='focus';}
function paintBtns(){$('startBtn').textContent=tm.running?'Pause':(tm.left<tm.total?'Resume':'Start');
  $('presets').innerHTML=PRE.map(p=>'<button data-pre="'+p[0]+'" aria-pressed="'+(S.set.focus===p[0]&&S.set.brk===p[1])+'">'+p[0]+' / '+p[1]+'</button>').join('')+(T_cur?'<button data-clear="1">Free session</button>':'');}
function renderTimerLog(){const a=logOf(Math.max(1,Math.min(20,rel()))).slice(-4).reverse();const live=rel()>=1&&rel()<=20;
  $('tmin').textContent=mins(live?logMin(logOf(rel())):0);
  $('log').innerHTML=live?a.map(l=>'<li><span>'+esc(l.s)+'</span><span>'+l.m+' min</span></li>').join(''):'';}
$('startBtn').onclick=()=>tm.running?pauseTimer():startTimer();
$('resetBtn').onclick=resetTimer;
$('skipBtn').onclick=()=>{const el=tm.total-(tm.running?Math.max(0,tm.endAt-Date.now()):tm.left);clearInterval(iv);if(tm.mode==='focus'&&el>=60000)logSession(el);lock(false);tm.startedAt=0;setMode(tm.mode==='focus'?'break':'focus');};
$('presets').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.clear){T_cur=null;renderToday();paintTimer();paintBtns();return;}
  if(b.dataset.pre){const p=PRE.find(x=>x[0]===+b.dataset.pre);S.set.focus=p[0];S.set.brk=p[1];$('fm').value=p[0];$('bm').value=p[1];save();if(!tm.running)setMode(tm.mode);else paintBtns();}});
['fm','bm'].forEach(id=>$(id).addEventListener('change',()=>{const f=Math.max(1,Math.min(180,+$('fm').value||50)),b=Math.max(1,Math.min(60,+$('bm').value||10));S.set.focus=f;S.set.brk=b;save();if(!tm.running)setMode(tm.mode);else paintBtns();}));
$('freeSubj').addEventListener('change',paintTimer);
$('freeSubj').innerHTML=['DAA','DMDW','SE','CN','EE','DOS'].map(s=>'<option value="'+s+'">'+s+'</option>').join('');
$('wipe').onclick=()=>{const b=$('wipe');if(b.dataset.arm){S={done:{},tp:{},pyq:{},conf:{},log:[],moved:{},slots:{},set:S.set,ts:0};save();b.dataset.arm='';b.textContent='Reset all progress';$('wipeNote').textContent='Progress cleared.';renderAll();}else{b.dataset.arm='1';b.textContent='Tap again to confirm';$('wipeNote').textContent='This clears ticks, confidence and focus history.';}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tm.running)tick();});

/* ---------- INIT ---------- */
$('fm').value=S.set.focus;$('bm').value=S.set.brk;
tm.total=tm.left=S.set.focus*60000;
paintSync();renderAll();paintBtns();paintTimer();
setInterval(()=>{if(midnight(new Date()).getTime()!==window.__d){window.__d=midnight(new Date()).getTime();renderHeader();}},60000);window.__d=midnight(new Date()).getTime();
</script>
